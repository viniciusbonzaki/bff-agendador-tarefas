version: "3.8"

services:
  agendador-tarefas:
    build: ..\agendador-tarefas
    container_name: agendador-tarefas
    ports:
      - "8081:8081"
    environment:
      - SPRING_DATA_MONGODB_URI=mongodb://mongo:27017
    depends_on:
      - mongo
  bff-agendador-tarefas:
    build: .
    container_name: bff-agendador-tarefas
    ports:
      - "8083:8083"
    environment:
      - USUARIOS_URL=usuarios:8080/usuarios
      - AGENDADOR_TAREFAS_URL=agendador-tarefas:8081/tarefas
      - NOTIFICACAO_URL=notificacao:8082/email
  usuarios:
    build: ..\usuarios
    container_name: usuarios
    ports:
      - "8080:8080"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/db_usuarios_teste
      - SPRING_DATASOURCE_USERNAME=admin
      - SPRING_DATASOURCE_PASSWORD=admin
    depends_on:
      - postgres
  notificacao:
    build: ..\notificacao
    container_name: notificacao
    ports:
      - "8082:8082"
  postgres:
    image: postgres:latest
    container_name: postgres
    restart: no
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin
      POSTGRES_DB: db_usuarios_teste
    ports:
      - "5433:5432"
  mongo:
    image: mongo:latest
    container_name: mongo
    restart: no
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: db_agendador

networks:
  default:
    driver: bridge